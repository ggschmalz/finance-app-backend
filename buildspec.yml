version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo Installing dependencies...
      - pip install -r requirements.txt
  pre_build:
    commands:
      - echo Running tests...
      - python manage.py test
  build:
    commands:
      - echo Build started on `date`
      - echo No specific build steps for Django on Elastic Beanstalk
  post_build:
    commands:
      - echo Build completed on `date`

artifacts:
  files:
    - '**/*'
  exclude-paths:
    - 'venv/**/*'
    - '.git/**/*'
    - '__pycache__/**/*'
    - '*/__pycache__/**/*'
